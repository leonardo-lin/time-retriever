<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Retriever training monitor</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c2430;
      --muted: #5d6b7c;
      --line: #d9e0e8;
      --paper: #f6f8fb;
      --card: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      color: var(--ink);
      background: var(--paper);
    }
    main { max-width: 1100px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { font-size: 32px; font-weight: 600; margin: 0 0 8px; }
    h2 { font-size: 18px; margin: 28px 0 12px; }
    p { line-height: 1.55; }
    .muted { color: var(--muted); }
    .cards, .split { display: grid; gap: 12px; }
    .cards { grid-template-columns: repeat(5, 1fr); margin-top: 20px; }
    .split { grid-template-columns: repeat(3, 1fr); }
    .card, .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
    }
    .card span, .panel span { display: block; color: var(--muted); font-size: 13px; font-family: system-ui, sans-serif; }
    .card strong, .panel strong { display: block; margin-top: 6px; font-size: 22px; font-variant-numeric: tabular-nums; }
    .panel strong { font-size: 16px; }
    canvas { width: 100%; height: 420px; display: block; }
    ul { margin: 8px 0 0; padding-left: 18px; }
    li { margin: 4px 0; }
    @media (max-width: 800px) {
      .cards, .split { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
<main>
  <h1>Retriever training</h1>
  <p class="muted" id="status">Connecting to the training process…</p>
  <section class="cards">
    <div class="card"><span>Train loss</span><strong id="train-loss">—</strong></div>
    <div class="card"><span>Contrastive</span><strong id="con-loss">—</strong></div>
    <div class="card"><span>Ranking</span><strong id="rank-loss">—</strong></div>
    <div class="card"><span>Val loss</span><strong id="val-loss">—</strong></div>
    <div class="card"><span>Val retrieval</span><strong id="val-retr">—</strong></div>
  </section>
  <h2>Loss curves</h2>
  <div class="panel"><canvas id="chart" width="1040" height="420"></canvas></div>
  <h2>Data for this run</h2>
  <section class="split" id="split"></section>
  <h2>Test retrieval</h2>
  <div class="panel" id="test-box"><span>Shown after training. This compares how similar the retrieved historical futures are, not load forecast error.</span></div>
</main>
<script>
const COLORS = {
  total: "#1f4b99",
  contrastive: "#c47b00",
  ranking: "#0d7a4f",
  validation: "#b42318"
};

function meanTrailing(values, width) {
  const out = [];
  let sum = 0;
  for (let i = 0; i < values.length; i++) {
    sum += values[i];
    if (i >= width) sum -= values[i - width];
    out.push(sum / Math.min(i + 1, width));
  }
  return out;
}

function drawChart(steps, epochs) {
  const canvas = document.getElementById("chart");
  const ctx = canvas.getContext("2d");
  const width = canvas.width;
  const height = canvas.height;
  ctx.clearRect(0, 0, width, height);
  const pad = { left: 64, right: 24, top: 24, bottom: 42 };
  const plotW = width - pad.left - pad.right;
  const plotH = height - pad.top - pad.bottom;
  const series = [];
  if (steps.length) {
    const total = steps.map(row => row.loss);
    series.push({ color: COLORS.total, values: meanTrailing(total, 8), width: 2.5 });
    series.push({ color: COLORS.contrastive, values: meanTrailing(steps.map(row => row.contrastive), 8), width: 1.5 });
    series.push({ color: COLORS.ranking, values: meanTrailing(steps.map(row => row.ranking), 8), width: 1.5 });
  }
  const valPoints = epochs.filter(row => Number.isFinite(row.val_loss));
  const all = series.flatMap(item => item.values).concat(valPoints.map(row => row.val_loss));
  ctx.font = "14px sans-serif";
  ctx.fillStyle = "#5d6b7c";
  if (!all.length) {
    ctx.fillText("No losses yet. This updates every second once training starts.", pad.left, pad.top + 24);
    return;
  }
  const min = Math.min(...all);
  const max = Math.max(...all);
  const span = Math.max(max - min, 1e-6);
  const y0 = min - span * 0.08;
  const y1 = max + span * 0.08;
  const xCount = Math.max(steps.length, valPoints.length ? valPoints[valPoints.length - 1].step : 1);

  function xOf(step) { return pad.left + (step / xCount) * plotW; }
  function yOf(value) { return pad.top + (1 - (value - y0) / (y1 - y0)) * plotH; }

  ctx.strokeStyle = "#e4ebf2";
  ctx.lineWidth = 1;
  for (let tick = 0; tick <= 4; tick++) {
    const value = y0 + (y1 - y0) * (tick / 4);
    const y = yOf(value);
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(width - pad.right, y);
    ctx.stroke();
    ctx.fillStyle = "#5d6b7c";
    ctx.fillText(value.toFixed(3), 8, y + 4);
  }

  function stroke(values, color, lineWidth) {
    ctx.beginPath();
    values.forEach((value, index) => {
      const x = xOf(index + 1);
      const y = yOf(value);
      if (index === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.strokeStyle = color;
    ctx.lineWidth = lineWidth;
    ctx.stroke();
  }
  series.forEach(item => stroke(item.values, item.color, item.width));

  if (valPoints.length) {
    ctx.beginPath();
    valPoints.forEach((row, index) => {
      const x = xOf(row.step);
      const y = yOf(row.val_loss);
      if (index === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.strokeStyle = COLORS.validation;
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.stroke();
    ctx.setLineDash([]);
    valPoints.forEach(row => {
      ctx.beginPath();
      ctx.arc(xOf(row.step), yOf(row.val_loss), 4, 0, Math.PI * 2);
      ctx.fillStyle = COLORS.validation;
      ctx.fill();
    });
  }

  ctx.fillStyle = "#1c2430";
  const legend = [
    ["Total", COLORS.total],
    ["Contrastive", COLORS.contrastive],
    ["Ranking", COLORS.ranking],
    ["Val", COLORS.validation]
  ];
  legend.forEach((item, index) => {
    const x = pad.left + index * 140;
    ctx.fillStyle = item[1];
    ctx.fillRect(x, height - 22, 14, 8);
    ctx.fillStyle = "#1c2430";
    ctx.fillText(item[0], x + 20, height - 14);
  });
  ctx.fillText("Step", width - 56, height - 14);
}

function showNumber(id, value) {
  document.getElementById(id).textContent = Number.isFinite(value) ? value.toFixed(4) : "—";
}

function renderSummary(summary) {
  const blocks = [
    ["Database", `${summary.database_cases} cases`, `${summary.database_origin_start} → ${summary.database_future_end}`],
    ["Train queries", `${summary.train_cases} cases`, `${summary.train_start} → ${summary.train_end}`],
    ["Val / test", `${summary.val_cases} / ${summary.test_cases} cases`, `Test ${summary.test_start} → ${summary.test_end}`]
  ];
  document.getElementById("split").innerHTML = blocks.map(item =>
    `<div class="panel"><span>${item[0]}</span><strong>${item[1]}</strong><span>${item[2]}</span><span>Database future ends ${summary.leakage_gap_hours} hours before the first query</span></div>`
  ).join("");
}

function renderTest(row) {
  if (!row) return;
  const hard = row.hard_negative_rate == null ? "none" : row.hard_negative_rate.toFixed(4);
  document.getElementById("test-box").innerHTML = `
    <span>Mean future similarity of the Top-${row.top_k} historical cases. Oracle ranks by true future similarity; it is an upper bound, not a forecasting method.</span>
    <ul>
      <li>This retriever: ${row.retrieved_future_similarity.toFixed(4)}</li>
      <li>Random: ${row.random_future_similarity.toFixed(4)}</li>
      <li>Oracle upper bound: ${row.oracle_future_similarity.toFixed(4)}</li>
      <li>Hard-negative rate: ${hard}</li>
    </ul>`;
}

async function refresh() {
  try {
    const [summaryRes, metricRes] = await Promise.all([fetch("/api/summary"), fetch("/api/metrics")]);
    if (summaryRes.ok) renderSummary(await summaryRes.json());
    const rows = metricRes.ok ? await metricRes.json() : [];
    const steps = rows.filter(row => row.kind === "step");
    const epochs = rows.filter(row => row.kind === "epoch");
    const test = rows.findLast(row => row.kind === "test");
    const last = steps[steps.length - 1];
    const lastEpoch = epochs[epochs.length - 1];
    showNumber("train-loss", last ? last.loss : NaN);
    showNumber("con-loss", last ? last.contrastive : NaN);
    showNumber("rank-loss", last ? last.ranking : NaN);
    showNumber("val-loss", lastEpoch ? lastEpoch.val_loss : NaN);
    showNumber("val-retr", lastEpoch ? lastEpoch.val_retrieved_future_similarity : NaN);
    document.getElementById("status").textContent = last
      ? `Epoch ${last.epoch}, step ${last.step}. The chart refreshes every second; the thick line is an 8-step moving average.`
      : "Data is ready. Building labels or starting the first step.";
    drawChart(steps, epochs);
    renderTest(test);
  } catch (error) {
    document.getElementById("status").textContent = "Monitor cannot reach the training process.";
  }
}
refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
